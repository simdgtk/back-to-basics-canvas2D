<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/reset.css" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>canvas-basics</title>
  </head>
  <body>
    <div class="overlay">
      <button class="overlay-button" id="launch-button">Lancer l'audio visualizer</button>
    </div>
    <div class="layout">
      <div class="layout-header">
        <h1 id="title">Audio visualizer</h1>
      </div>
      <div class="canvas-track">
        <div class="track-container">
          <div class="track" id="track"></div>
          <img class="track-cursor" id="track-cursor" src="/images/knob.webp"/>
          <span class="track-label">Track height</span>
        </div>
        <div class="canvas-container">
          <canvas id="canvas"></canvas>
          <div class="canvas-border"></div>
          <div id="bar"></div>
        </div>
      </div>
      <div class="controls" id="controls">
      </div>
    </div>
    <audio src="/audio/tenSeconds.wav" id="audio" loop></audio>
    <script defer type="module" src="/src/AudioProject.ts"></script>
  </body>
</html>
